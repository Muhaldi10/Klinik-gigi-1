<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-page">

    <section class="login-form">
      <form action="#" method="post">
        <h1>Login</h1>
        <p class="subtitle">Klinik Gigi Dontol</p>

        <input type="email" name="email" placeholder="Email" aria-label="Email" required>
        <input type="password" name="password" placeholder="Password" aria-label="Password" required>

        <div class="options">
          <label class="remember">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit">Log In</button>

        <p class="signup">No account yet? <a href="#">Sign Up</a></p>
      </form>
    </section>

    <section class="login-image">
      <div class="image-card">
        <img src="dentist_picture.jpg" alt="" onerror="this.style.display='none'">
        <span class="placeholder">INI GAMBAR</span>
      </div>
    </section>

  </main>
</body>
</html>
